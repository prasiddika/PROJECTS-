<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinSense AI | Professional Glow</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #ff8fa3;
            --primary-dark: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.85);
            --accent-green: #00e676;
            --text-main: #333;
            --text-sub: #666;
            --divider: #eee;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: #fff5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px;
            width: 95%;
            max-width: 900px;
            box-shadow: 0 20px 60px rgba(255, 77, 109, 0.15);
        }

        /* Essential utility for state switching */
        .hidden {
            display: none !important;
        }

        /* Reusable Side-by-Side Flex Layout */
        .side-by-side {
            display: flex;
            gap: 40px;
            align-items: center;
            text-align: left;
        }

        .left-panel {
            flex: 1;
            min-width: 300px;
        }

        .right-panel {
            flex: 1.2;
            min-width: 300px;
        }

        /* Header Styling */
        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            margin: 0 0 10px 0;
        }

        header p {
            color: var(--text-sub);
            margin: 0 0 30px 0;
            font-size: 1rem;
        }

        /* Image Styling */
        .image-frame {
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            line-height: 0;
            /* Fixes tiny gap below video/image */
        }

        #webcam,
        #previewImg {
            width: 100%;
            display: block;
            object-fit: cover;
            aspect-ratio: 4/5;
        }

        /* Scanning Animation */
        .scan-line {
            display: none;
            position: absolute;
            width: 100%;
            height: 5px;
            background: var(--primary-dark);
            box-shadow: 0 0 15px var(--primary-dark);
            z-index: 10;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% {
                top: 0%;
            }

            100% {
                top: 100%;
            }
        }

        /* General Button Styling */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .analyze-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            margin-top: 20px;
        }

        .reset-btn {
            background: white;
            border: 1px solid #ddd;
            color: var(--text-main);
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #fafafa;
            border-color: #ccc;
        }

        /* Divider */
        .divider-container {
            margin: 25px 0;
            color: #bbb;
            font-weight: bold;
            text-align: center;
        }

        /* DropZone Styling */
        .drop-zone {
            border: 2px dashed #ffcad4;
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
        }

        .drop-zone:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--primary);
        }

        /* Status Dot Styling */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }

        .dot.active {
            background: var(--accent-green) !important;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        /* Results Display */
        #skinTypeDisplay {
            font-size: 2.5rem;
            margin: 10px 0;
            font-weight: 700;
            color: var(--text-main);
        }

        #confidenceScore {
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 1rem;
        }

        .product-list {
            list-style: none;
            padding: 0;
            color: #555;
        }

        .product-list li {
            margin-bottom: 10px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-list li i {
            color: var(--accent-green);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--divider);
            margin: 20px 0;
        }

        /* Mobile Responsiveness */
        @media (max-width: 700px) {
            .side-by-side {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .left-panel,
            .right-panel {
                width: 100%;
                min-width: 0;
            }

            #skinTypeDisplay {
                font-size: 2rem;
            }

            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="glass-card">

            <div id="uploadView">
                <header>
                    <h1>SkinSense <span style="color: var(--primary-dark);">AI</span></h1>
                    <p>Capture or upload a photo to begin</p>
                </header>

                <div class="side-by-side">
                    <div class="left-panel">
                        <div class="image-frame">
                            <video id="webcam" autoplay playsinline></video>
                            <canvas id="captureCanvas" style="display:none;"></canvas>
                        </div>
                    </div>

                    <div class="right-panel">
                        <button id="captureBtn" class="btn analyze-btn">
                            <i class="fas fa-camera"></i> Capture & Analyze Live
                        </button>

                        <div class="divider-container">— OR —</div>

                        <div id="dropZone" class="drop-zone">
                            <input type="file" id="imageInput" accept="image/*" style="display:none;">
                            <p onclick="document.getElementById('imageInput').click()" style="margin:0;">
                                <i class="fas fa-cloud-upload-alt" style="margin-right:8px;"></i> Select from Gallery
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultView" class="hidden">
                <div class="side-by-side">
                    <div class="left-panel">
                        <div class="image-frame">
                            <img id="previewImg" src="">
                            <div id="scanLine" class="scan-line"></div>
                        </div>
                    </div>

                    <div class="right-panel">
                        <div class="status-badge">
                            <span id="statusDot" class="dot"></span>
                            <span id="statusText">Ready</span>
                        </div>
                        <h2 id="skinTypeDisplay">Analysis Ready</h2>
                        <p id="confidenceScore"></p>
                        <hr>

                        <h4 style="margin-bottom: 10px; color: #444;">Recommended Care:</h4>
                        <ul id="productsList" class="product-list"></ul>

                        <button id="resetBtn" class="btn reset-btn">
                            <i class="fas fa-arrow-left"></i> Analyze another photo
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const uploadView = document.getElementById('uploadView');
        const resultView = document.getElementById('resultView');
        const previewImg = document.getElementById('previewImg');
        const scanLine = document.getElementById('scanLine');
        const statusDot = document.getElementById('statusDot');

        // Start Camera Stream
        window.addEventListener('load', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access denied or not found.");
            }
        });

        // Capture from Webcam
        document.getElementById('captureBtn').addEventListener('click', () => {
            const canvas = document.getElementById('captureCanvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
                processAndAnalyze(file);
            }, 'image/jpeg');
        });

        // Handle File Upload
        document.getElementById('imageInput').addEventListener('change', function () {
            if (this.files[0]) processAndAnalyze(this.files[0]);
        });

        // Core Processing Logic
        async function processAndAnalyze(file) {
            // 1. Swap Views
            uploadView.classList.add('hidden');
            resultView.classList.remove('hidden');

            // 2. Setup Loading State
            previewImg.src = URL.createObjectURL(file);
            scanLine.style.display = 'block';
            statusDot.classList.add('active');
            document.getElementById('statusText').innerText = "Analyzing Texture...";
            document.getElementById('skinTypeDisplay').innerText = "Analyzing...";

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch("/predict", { method: "POST", body: formData });
                const data = await res.json();
                const score = parseFloat(data.confidence);

                if (score < 90) { // If the AI is less than 50% sure
                    document.getElementById('skinTypeDisplay').innerText = "Invalid Scan";
                    document.getElementById('statusText').innerText = "Please align your face in the frame";
                    document.getElementById('productsList').innerHTML = "<li>No face detected.</li>";
                    return; // Stop here
                }

                // 3. If the score is GOOD, Display AI Results
                document.getElementById('skinTypeDisplay').innerText = data.skin_type;
                document.getElementById('confidenceScore').innerText = `Confidence: ${data.confidence}`;

                // Generate list items
                document.getElementById('productsList').innerHTML = data.products.map(p =>
                    `<li><i class="fas fa-check-circle"></i> ${p}</li>`
                ).join('');

                document.getElementById('statusText').innerText = "Analysis Complete";

            } catch (err) {
                console.error(err);
                document.getElementById('statusText').innerText = "Connection Error";
                document.getElementById('skinTypeDisplay').innerText = "Error";
            } finally {
                scanLine.style.display = 'none'; // Stop the "Laser"
            }
        }

        // Reset Button
        document.getElementById('resetBtn').addEventListener('click', () => {
            location.reload(); // Refresh the page to reset the camera and state
        });
    </script>
</body>

</html>
